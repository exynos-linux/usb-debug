# Part of the debug layer's "no silent hang" safety net, in the initrd and in
# the booted system: PID 1 pets the hardware watchdog, so if systemd itself
# hangs the SoC resets. Device packages may override the device and timeout
# (sorted later, e.g. 50-<device>-watchdog.conf).
[Manager]
WatchdogDevice=/dev/watchdog0
RuntimeWatchdogSec=30s
RebootWatchdogSec=60s
